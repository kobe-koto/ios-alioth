# Redmi K40 / POCO F3 (alioth) -- SM8250-AC, Adreno 650.
NAME="Redmi K40 (alioth)"
KIND=phone
SOC="Qualcomm Snapdragon 870 (SM8250-AC)"

UEFI_TARGET=alioth
UEFI_FD=
DTB=
FD_BASE=0x9FC00000              # Mu-Silicium aliothPkg, MemoryMapLib: "UEFI FD"
FD_SIZE=0x300000
PAYLOAD_BASE=0xF0000000

FB_BASE=0x9C000000              # 1080 x 2400; the phone's cont_splash_region@9c000000 = "Display Reserved"
WIFI_ATH11K=0                   # a QCA6390 on PCIe (MHI), not the AHB WCN6750 the ath11k driver here serves

# adreno_soc=a650 picks the K40's row of the GPU driver; its zap memory is 0x8681a000, the region
# Mu-Silicium's alioth.dtb reserves as pil_gpu_region. The phone's own Android tree reserves
# 0x8c41a000 instead -- what matters is the map the run boots with, so no adreno_zap_mem= is
# needed here; pass it only if another tree is used.
# With GL=1 images, add gpu=1 (and wifi=1 once the PCIe Wi-Fi driver exists).
BOOTARGS="touchscreen=1 cpufreq=1 bootcpu=7 cpus=8 adreno_soc=a650"
DEFAULT_SECS=900
USERLAND_VARS=""
# taken from the phone's Android with adb (see README.md, "On the phone")
FIRMWARE="fw-gpu"
